version: '3.8'

services:

    # ============================================================
    # Laravel Application (PHP + Apache)
    # ============================================================
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: syride_app:latest
        container_name: syride_app
        ports:
            - "8080:80"
        restart: unless-stopped
        env_file: .env
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            APP_URL: https://api.onwayride.me
            DB_HOST: mysql
        depends_on:
            mysql:
                condition: service_healthy

    # ============================================================
    # MySQL Database
    # ============================================================
    mysql:
        image: mysql:8.0
        container_name: syride_mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$DB_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 15
        restart: unless-stopped

    # ============================================================
    # Queue Worker
    # ============================================================
    queue:
        image: syride_app:latest
        container_name: syride_queue
        command: php artisan queue:work --tries=3 --timeout=60 --sleep=3
        env_file: .env
        environment:
            APP_ENV: production
            DB_HOST: mysql
        depends_on:
            mysql:
                condition: service_healthy
            app:
                condition: service_started
        restart: unless-stopped

# ============================================================
# Volumes
# ============================================================
volumes:
    mysql_data:
