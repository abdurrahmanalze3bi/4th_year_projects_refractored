version: '3.8'

services:

    # ============================================================
    # Laravel Application (PHP + Apache)
    # ============================================================
    app:
        build: .
        container_name: syride_app
        ports:
            - "8000:80"
        environment:
            APP_NAME: SyRide
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8000
            APP_KEY: base64:rT9IwC51dggaW9pTOzG8YXCOjZ2f+iyBXp5zCAisJtQ=
            APP_TIMEZONE: Asia/Damascus

            # Database
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: 4th_year_project_db
            DB_USERNAME: root
            DB_PASSWORD: secret

            # Cache & Queue
            CACHE_DRIVER: file
            QUEUE_CONNECTION: database
            SESSION_DRIVER: cookie

            # JWT
            JWT_SECRET: IYhJaTmSt1oD7OvS8K8SUUi9mFsWhElFyVvDadMKull0w4OxDtNCzRPK6zQvTLGJ
            JWT_ALGO: HS256

            # Logging
            LOG_CHANNEL: stack
            LOG_LEVEL: debug

            # OTP
            OTP_BYPASS_ENABLED: "true"
            WALLET_OTP_MODE: testing

            # Admin
            ADMIN_PRIMARY_EMAIL: twisrmann2002@gmail.com
            ADMIN_PRIMARY_PASSWORD: arayaz8152002
            ADMIN_PRIMARY_PHONE: "0912345678"
            ADMIN_SYCASH_EMAIL: sycash-sim@gmail.com
            ADMIN_SYCASH_PASSWORD: sycash123456
            ADMIN_SYCASH_PHONE: "0987654321"
            ADMIN_WALLET_PHONE: "0987654321"
            SYCASH_WALLET_PHONE: "0987654321"

            # Pusher
            BROADCAST_DRIVER: pusher
            PUSHER_APP_ID: "1997277"
            PUSHER_APP_KEY: 28fa324491dc6542b0fb
            PUSHER_APP_SECRET: 5bcbce71082f70a31e3d
            PUSHER_APP_CLUSTER: ap2
            PUSHER_SCHEME: https
            PUSHER_PORT: "443"

            # OpenRoute
            OPENROUTE_API_KEY: 5b3ce3597851110001cf6248bc7694410f7d4991988a0f4d3bf4c260
            OPENROUTE_SSL_VERIFY: "false"
            OPENROUTE_TIMEOUT: "30"
            OPENROUTE_CACHE_TTL: "86400"

            # Firebase
            FIREBASE_CREDENTIALS: config/firebase-credentials.json
            FCM_PROJECT_ID: 4thyearproject-c4076
            FCM_SENDER_ID: "772114208314"
            GOOGLE_APPLICATION_CREDENTIALS: /var/www/html/config/firebase-credentials.json

        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
            - node_modules_data:/var/www/html/node_modules
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped

    # ============================================================
    # MySQL Database
    # ============================================================
    mysql:
        image: mysql:8.0
        container_name: syride_mysql
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: 4th_year_project_db
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
            interval: 5s
            timeout: 5s
            retries: 15
        restart: unless-stopped

    # ============================================================
    # Queue Worker
    # ============================================================
    queue:
        build: .
        container_name: syride_queue
        command: php artisan queue:work --tries=3 --timeout=60 --sleep=3
        environment:
            APP_ENV: local
            APP_KEY: base64:rT9IwC51dggaW9pTOzG8YXCOjZ2f+iyBXp5zCAisJtQ=
            APP_TIMEZONE: Asia/Damascus
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: 4th_year_project_db
            DB_USERNAME: root
            DB_PASSWORD: secret
            QUEUE_CONNECTION: database
            JWT_SECRET: IYhJaTmSt1oD7OvS8K8SUUi9mFsWhElFyVvDadMKull0w4OxDtNCzRPK6zQvTLGJ
            LOG_CHANNEL: stack
            LOG_LEVEL: debug
        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
            - node_modules_data:/var/www/html/node_modules
        depends_on:
            mysql:
                condition: service_healthy
            app:
                condition: service_started
        restart: unless-stopped

# ============================================================
# Volumes
# ============================================================
volumes:
    mysql_data:
    vendor_data:
    node_modules_data:
